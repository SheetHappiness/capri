name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-tests:
    name: Windows Python 3.14
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run unit and integration tests
        run: python -m pytest -q
      - name: Check whitespace
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ($env:EVENT_NAME -eq 'pull_request') {
            git diff --check "$env:BASE_SHA...$env:HEAD_SHA"
          } elseif ($env:BASE_SHA -eq ('0' * 40)) {
            # A new branch has no before commit: compare with the empty tree.
            git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 $env:HEAD_SHA
          } else {
            git diff --check $env:BASE_SHA $env:HEAD_SHA
          }
          exit $LASTEXITCODE
