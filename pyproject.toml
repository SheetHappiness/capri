[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "capri"
version = "0.0.1"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiogram==3.31.0",
    "omp-rpc==0.1.0",
]

[project.scripts]
capri = "capri.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
